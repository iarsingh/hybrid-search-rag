apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-search-rag
  labels:
    app: hybrid-search-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-search-rag
  template:
    metadata:
      labels:
        app: hybrid-search-rag
    spec:
      containers:
        - name: api
          image: hybrid-search-rag:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hybrid-search-rag
spec:
  selector:
    app: hybrid-search-rag
  ports:
    - port: 80
      targetPort: 8080
